name: Growth workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: founderos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt ruff==0.17.5
        working-directory: backend
      - run: ruff check app tests migrations && ruff format --check app tests migrations
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check && python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/founderos_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/founderos_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-lock.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start backend and frontend
        run: |
          cd backend
          alembic upgrade head
          uvicorn app.main:app --port 8000 --no-access-log > /tmp/founderos-api.log 2>&1 &
          python -m app.workflows.worker > /tmp/founderos-worker.log 2>&1 &
          cd ../frontend
          npm run start > /tmp/founderos-web.log 2>&1 &
      - name: Wait for services
        run: |
          python - <<'PYCODE'
          import time, urllib.request
          for url in ['http://localhost:8000/ready', 'http://localhost:3000']:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=1).close()
                      break
                  except OSError:
                      time.sleep(0.5)
              else:
                  raise SystemExit('Service did not become ready: ' + url)
          PYCODE
      - run: python frontend/tests/smoke.py
