services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: founderos
      POSTGRES_DB: founderos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://founderos:${POSTGRES_PASSWORD}@db:5432/founderos
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://founderos:${POSTGRES_PASSWORD}@db:5432/founderos
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GENERATION_MODE: ${GENERATION_MODE:-template}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
      LINKEDIN_APP_ID: ${LINKEDIN_APP_ID:-}
      LINKEDIN_APP_SECRET: ${LINKEDIN_APP_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WORKFLOW_MONTHLY_RUN_LIMIT: ${WORKFLOW_MONTHLY_RUN_LIMIT:-40}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./backend
    command: ["python", "-m", "app.workflows.worker"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on: [api]
volumes:
  postgres-data:
